events {
    # Maximum number of simultaneous connections that each worker process can handle
    worker_connections 1024;
}

http {
    server {
        # Listen on standard HTTP port 80
        listen 80;
        server_name localhost;

        # Forward all incoming traffic to the FastAPI container
        location / {
            # 'service-pulse' is resolved by Docker's internal DNS to the FastAPI container
            proxy_pass http://service-pulse:8000;

            # Pass essential HTTP headers so FastAPI knows the real client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
