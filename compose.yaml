# Top-level key that defines all containers (services) managed by Docker Compose
services:

  # -------------------------------------------------------------------------
  # Service 1: The NGINX Reverse Proxy (The only public entry point!)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: service-pulse-nginx
    restart: unless-stopped
    # Public entrypoint on standard HTTP port 80
    ports:
      - "80:80"
    # Mount custom nginx.conf into the container (read-only for security)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service-pulse

  # -------------------------------------------------------------------------
  # Service 2: The FastAPI web application (Internal only - no public ports)
  # -------------------------------------------------------------------------
  service-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-pulse
    # Note: 'ports' mapping is removed! FastAPI is hidden inside Docker's network.
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/service_pulse
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Service 3: The PostgreSQL database (Internal persistence)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: service-pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Named volumes: managed by Docker outside container lifecycles for persistence
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
